# Builds the web interface and publishes it on GitHub Pages
# whenever the frontend changes on main.
#
# One-time setup (see docs/deployment.md):
#   1. Repository -> Settings -> Pages -> Source: "GitHub Actions"
#   2. Repository -> Settings -> Secrets and variables -> Actions -> Variables:
#      add VITE_API_URL = the address of your Render backend
name: Deploy frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  # Lets you run it by hand from the Actions tab, for example after changing VITE_API_URL.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a newer push replaces a waiting one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/configure-pages@v5
      - name: Build
        working-directory: frontend
        env:
          # Pages serves the site at https://<user>.github.io/<repository>/
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
